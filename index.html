<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Full Armor</title>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Figtree:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<style>
/* Layout: one-column phone app, sticky XP header, fixed bottom tab bar, forged steel and brass */
:root{
  --bg:#eef0f4;--surface:#ffffff;--surface2:#f6f7fa;--ink:#1b2230;--muted:#5d6676;--line:#d6dae2;
  --brass:#9a6b17;--brass-ink:#6e4c0f;--brass-soft:#f4e7c9;--steel:#3b4a63;--good:#2f7d4f;--good-soft:#dcefe3;--warn:#b0562e;--warn-soft:#f7e2d8;
  --body:#c9ced8;--shadow:rgba(20,26,40,.12);
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;--f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--f-text:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121722;--surface:#1b2230;--surface2:#222b3b;--ink:#e9ecf2;--muted:#9aa3b3;--line:#2f394b;
  --brass:#e0b45a;--brass-ink:#f1d395;--brass-soft:#3a3020;--steel:#9fb2d1;--good:#6fc394;--good-soft:#1d3527;--warn:#e38a63;--warn-soft:#3b2419;
  --body:#3a4458;--shadow:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121722;--surface:#1b2230;--surface2:#222b3b;--ink:#e9ecf2;--muted:#9aa3b3;--line:#2f394b;
  --brass:#e0b45a;--brass-ink:#f1d395;--brass-soft:#3a3020;--steel:#9fb2d1;--good:#6fc394;--good-soft:#1d3527;--warn:#e38a63;--warn-soft:#3b2419;
  --body:#3a4458;--shadow:rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:17px}
.lvl{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.lvl small{font-size:12px;color:var(--muted);white-space:nowrap}
.xpbar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--brass);transition:width .5s}
.streak{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--warn)}
main{padding-block:16px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brass)}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;margin:4px 0 12px;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.rowx{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--surface)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.brass{background:var(--brass-soft);border-color:transparent;color:var(--brass-ink)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.ref{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.03em}
.verse{font-family:var(--f-text);font-size:20px;line-height:1.65}
.verse .w{display:inline}
.verse .hid{display:inline-block;min-width:1.6em;border-bottom:2px solid var(--brass);color:transparent;cursor:pointer;line-height:1.2;margin-bottom:-2px}
.verse .hid.show{color:var(--ink);border-color:transparent;background:var(--brass-soft);border-radius:4px}
.verse .done{color:var(--ink)}
.verse .blank{display:inline-block;border-bottom:2px solid var(--line);color:transparent;line-height:1.2}
.verse .cur{border-color:var(--brass)}
.letters{font-family:var(--f-text);font-size:22px;letter-spacing:.08em;word-spacing:.3em;line-height:1.8}
.cue{display:flex;gap:10px;align-items:flex-start;background:var(--brass-soft);color:var(--brass-ink);border-radius:10px;padding:10px 12px;font-size:14px}
.cue svg{flex:none;width:18px;height:18px;margin-top:2px}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grades button{border-radius:10px;padding:10px 6px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;font-weight:600}
.grades button small{font-weight:400;font-size:12px;color:var(--muted)}
.grades .hard{border-color:var(--warn)}
.grades .good{border-color:var(--steel)}
.grades .easy{border-color:var(--good)}
.typebox{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brass)}
.list .item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--f-text);font-size:15px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:80px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass-ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:6px}
.room .n{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.room .r{font-family:var(--f-display);font-weight:700;font-size:14px}
.room.empty .r{color:var(--muted);font-family:var(--f-ui);font-weight:400;font-size:13px}
.image{font-family:var(--f-text);font-style:italic;font-size:16px;line-height:1.55}
.figure{display:flex;justify-content:center}
.figure svg{width:min(240px,70vw);height:auto}
.pc-on{fill:var(--brass);stroke:var(--brass-ink);stroke-width:1.5}
.pc-off{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 3;opacity:.55}
.bodyf{fill:var(--body)}
.armory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.piece{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.piece svg{width:42px;height:42px;flex:none}
.piece .t{font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.25}
.piece.locked .t{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:13px}
.badge .dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--line);color:var(--surface);font-size:12px;font-weight:700}
.badge.on .dot{background:var(--brass)}
.badge:not(.on){color:var(--muted)}
.prayer .who{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--steel);color:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.prayer .body{font-family:var(--f-text);font-size:16px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.upd{border-left:2px solid var(--brass);padding-left:10px;margin:6px 0;font-size:14px;border-radius:0;overflow-wrap:anywhere}
.answered{border-color:var(--good)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.72);display:grid;place-items:center;padding:24px}
.levelup{background:var(--surface);border-radius:18px;padding:24px 20px;max-width:340px;width:100%;text-align:center;border:2px solid var(--brass)}
.levelup svg{width:120px;height:120px}
.levelup .big{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--brass);margin:6px 0}
.glow{animation:rise .8s ease-out both}
@keyframes rise{from{transform:scale(.6) rotate(-8deg);opacity:.2}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity .3s}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.empty svg{width:56px;height:56px;color:var(--brass);margin-bottom:6px}
.confirm{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.counter{font-variant-numeric:tabular-nums}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tilebtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;font-family:var(--f-text);font-size:17px;line-height:1.3;text-align:left;max-width:100%}
.tilebtn:disabled{opacity:.3;cursor:default}
.built{font-family:var(--f-text);font-size:20px;line-height:1.65;min-height:2.4em;border-bottom:1px dashed var(--line);padding-bottom:6px}
.pic{font-size:1.25em;line-height:1;font-style:normal}
.strip{font-size:30px;letter-spacing:.12em;line-height:1.4;overflow-wrap:anywhere}
.pw{cursor:pointer;border-radius:6px;padding:0 3px;border-bottom:2px dotted var(--brass)}
.pw.on{background:var(--brass-soft)}
.gear{background:none;border:0;padding:6px;margin-right:-6px;color:var(--muted);display:grid;place-items:center}
.gear svg{width:22px;height:22px}
.tagline{font-family:var(--f-text);font-style:italic;font-size:17px;line-height:1.5}
.onb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.onb button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:600}
.onb button small{font-weight:400;color:var(--muted);font-size:13px}
.setrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow .grow{flex:1;min-width:0}
:root.big body{font-size:18px}
:root.big .verse,:root.big .built{font-size:25px}
:root.big .letters{font-size:27px}
:root.big .btn{padding:13px 18px;font-size:18px}
:root.big .tilebtn{font-size:21px;padding:11px 15px}
:root.big .small{font-size:16px}
:root.big .clip{font-size:17px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const STARTER = [{"b":"Joshua","c":1,"v1":9,"v2":9,"bsb":"Have I not commanded you to be strong and courageous? Do not be afraid; do not be discouraged, for the LORD your God is with you wherever you go.”","kjv":"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the Lord thy God is with thee whithersoever thou goest."},{"b":"Psalms","c":119,"v1":11,"v2":11,"bsb":"I have hidden Your word in my heart that I might not sin against You.","kjv":"Thy word have I hid in mine heart, that I might not sin against thee."},{"b":"Proverbs","c":3,"v1":5,"v2":6,"bsb":"Trust in the LORD with all your heart, and lean not on your own understanding; in all your ways acknowledge Him, and He will make your paths straight.","kjv":"Trust in the Lord with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.","bsbParts":["Trust in the LORD with all your heart, and lean not on your own understanding;","in all your ways acknowledge Him, and He will make your paths straight."],"kjvParts":["Trust in the Lord with all thine heart; and lean not unto thine own understanding.","In all thy ways acknowledge him, and he shall direct thy paths."]},{"b":"Isaiah","c":40,"v1":31,"v2":31,"bsb":"But those who wait upon the LORD will renew their strength; they will mount up with wings like eagles; they will run and not grow weary, they will walk and not faint.","kjv":"But they that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."},{"b":"Jeremiah","c":29,"v1":11,"v2":11,"bsb":"For I know the plans I have for you, declares the LORD, plans to prosper you and not to harm you, to give you a future and a hope.","kjv":"For I know the thoughts that I think toward you, saith the Lord, thoughts of peace, and not of evil, to give you an expected end."},{"b":"Matthew","c":6,"v1":33,"v2":33,"bsb":"But seek first the kingdom of God and His righteousness, and all these things will be added unto you.","kjv":"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."},{"b":"Matthew","c":11,"v1":28,"v2":28,"bsb":"Come to Me, all you who are weary and burdened, and I will give you rest.","kjv":"Come unto me, all ye that labour and are heavy laden, and I will give you rest."},{"b":"John","c":3,"v1":16,"v2":16,"bsb":"For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.","kjv":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."},{"b":"John","c":14,"v1":6,"v2":6,"bsb":"Jesus answered, “I am the way and the truth and the life. No one comes to the Father except through Me.","kjv":"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."},{"b":"Romans","c":3,"v1":23,"v2":23,"bsb":"for all have sinned and fall short of the glory of God,","kjv":"For all have sinned, and come short of the glory of God;"},{"b":"Romans","c":6,"v1":23,"v2":23,"bsb":"For the wages of sin is death, but the gift of God is eternal life in Christ Jesus our Lord.","kjv":"For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord."},{"b":"Romans","c":8,"v1":28,"v2":28,"bsb":"And we know that God works all things together for the good of those who love Him, who are called according to His purpose.","kjv":"And we know that all things work together for good to them that love God, to them who are the called according to his purpose."},{"b":"Romans","c":12,"v1":2,"v2":2,"bsb":"Do not be conformed to this world, but be transformed by the renewing of your mind. Then you will be able to test and approve what is the good, pleasing, and perfect will of God.","kjv":"And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God."},{"b":"2 Corinthians","c":5,"v1":17,"v2":17,"bsb":"Therefore if anyone is in Christ, he is a new creation. The old has passed away. Behold, the new has come!","kjv":"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new."},{"b":"Galatians","c":2,"v1":20,"v2":20,"bsb":"I have been crucified with Christ, and I no longer live, but Christ lives in me. The life I live in the body, I live by faith in the Son of God, who loved me and gave Himself up for me.","kjv":"I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me."},{"b":"Ephesians","c":2,"v1":8,"v2":9,"bsb":"For it is by grace you have been saved through faith, and this not from yourselves; it is the gift of God, not by works, so that no one can boast.","kjv":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: Not of works, lest any man should boast.","bsbParts":["For it is by grace you have been saved through faith, and this not from yourselves; it is the gift of God,","not by works, so that no one can boast."],"kjvParts":["For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:","Not of works, lest any man should boast."]},{"b":"Ephesians","c":6,"v1":10,"v2":11,"bsb":"Finally, be strong in the Lord and in His mighty power. Put on the full armor of God, so that you can make your stand against the devil’s schemes.","kjv":"Finally, my brethren, be strong in the Lord, and in the power of his might. Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.","bsbParts":["Finally, be strong in the Lord and in His mighty power.","Put on the full armor of God, so that yo let session=null;
function dueList(){return S.verses.filter(v=>v.due<=today()).sort((a,b)=>a.due.localeCompare(b.due))}
function stemOf(w){w=String(w).toLowerCase().replace(/[’']s\b/g,"").replace(/[^a-z]/g,"");if(PICS[w])return w;
  for(const[suf,add]of[["eth","e"],["eth",""],["es",""],["s",""],["ed","e"],["ed",""],["ing","e"],["ing",""],["est",""]]){if(w.endsWith(suf)&&w.length>suf.length+2){const b=w.slice(0,-suf.length)+add;if(PICS[b])return b}}return w}
function autoPics(v){const map={},words=textOf(v).split(" "),lim=Math.max(4,Math.min(14,4+Math.floor(words.length/12)));let n=0;
  for(const w of words){const s=stemOf(w);if(n>=lim)break;if(PICS[s]&&!PIC_STOP.has(s)&&!(s in map)){map[s]=PICS[s][0];n++}}return map}
function ensurePics(v){if(!v.pics||typeof v.pics!=="object")v.pics=autoPics(v);return v.pics}
function hasPics(v){return Object.values(ensurePics(v)).some(Boolean)}
const cleanW=w=>w.replace(/^[^A-Za-z’']+|[^A-Za-z’']+$/g,"");
const normW=w=>cleanW(w).toLowerCase().replace(/’/g,"'");
function rebusHTML(v,txt){ensurePics(v);return txt.split(" ").map(w=>{const p=v.pics[stemOf(w)];if(!p)return esc(w);const tail=(w.match(/[^A-Za-z’']+$/)||[""])[0];return `<span class="pic" aria-label="${esc(cleanW(w))}">${p}</span>${esc(tail)}`}).join(" ")}
function picStrip(v,txt){ensurePics(v);return txt.split(" ").map(w=>v.pics[stemOf(w)]).filter(Boolean).join(" ")}
function picEditHTML(v){ensurePics(v);return textOf(v).split(" ").map(w=>{const s=stemOf(w),p=v.pics[s];return PICS[s]?`<span class="pw ${p?"on":""}" data-pw="${esc(s)}">${p?p+" ":""}${esc(w)}</span>`:esc(w)}).join(" ")}
function shuffleArr(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(b.length>1&&b.every((x,i)=>x===a[i]))b.reverse();return b}
function bankBlanks(v,words){const idx=[];words.forEach((w,i)=>{if(/[A-Za-z]{2,}/.test(w)&&!PIC_STOP.has(normW(w)))idx.push(i)});const max=S.settings.easy?4:7;if(idx.length<=max)return idx;const step=idx.length/max;return Array.from({length:max},(_,k)=>idx[Math.floor(k*step+step/2)])}
function phrases(txt){const w=txt.split(" "),size=Math.max(3,Math.ceil(w.length/(S.settings.easy?5:8)));const out=[];let cur=[];
  w.forEach(x=>{cur.push(x);if(cur.length>=size||(/[,;:.!?]["'”’)]*$/.test(x)&&cur.length>=2)){out.push(cur.join(" "));cur=[]}});
  if(cur.length){if(cur.length===1&&out.length)out[out.length-1]+=" "+cur[0];else out.push(cur.join(" "))}return out}

function grade(g){const v=curVerse(),parts=verseParts(v),c=session.card;
  if(parts.length>1&&(v.unlocked||1)<parts.length&&g!=="hard"&&v.journey&&(v.dayUnlocks||0)>=S.paths.book.perDay){v.reps++;v.interval=1;v.due=addDays(1);v.last=today();session.queue.shift();session.done++;award({good:10,easy:15}[g],"Review");nextCard();return}
  if(parts.length>1&&(v.unlocked||1)<parts.length&&g!=="hard"){v.unlocked=(v.unlocked||1)+1;if(v.journey)v.dayUnlocks=(v.dayUnlocks||0)+1;v.last=today();session.queue.push(session.queue.shift());award(15,"New verse in the chain");session.card=null;nextCard();return}
  const n=nextInterval(v,g);
  if(g==="hard"){v.ease=Math.max(1.3,v.ease-.2);v.lapses++;if(!session.retry[v.id]){session.retry[v.id]=1;session.queue.push(v.id)}}
  if(g==="easy")v.ease=Math.min(3.2,v.ease+.15);
  const wasNew=v.reps===0,wasStrong=v.interval>=30;
  v.reps++;v.interval=n;v.due=addDays(n);v.last=today();
  session.queue.shift();session.done++;
  let xp={hard:5,good:10,easy:15}[g];if(wasNew)xp+=15;if(c.score!=null&&c.score>=85)xp+=5;
  award(xp,wasNew?"Verse learned":"Review");
  if(!wasStrong&&v.interval>=30)setTimeout(()=>award(50,"Verse mastered"),900);
  nextCard();}

document.addEventListener("click",e=>{

});
document.addEventListener("input",e=>{if(e.target.id!=="typebox"||!session||!session.card)return;

let heard="",micHooked=false;

const OWN_EXAMPLES=[["The Apostles' Creed","I believe in God, the Father almighty, creator of heaven and earth."],["Catechism Q1","Q. What is the chief end of man? A. Man's chief end is to glorify God, and to enjoy him forever."],["Amazing Grace, verse 1","Amazing grace! How sweet the sound that saved a wretch like me!"]];
function ownFormHTML(){return `<div class="card stack"><label class="f">Title<input type="text" id="ownT" maxlength="80" placeholder="The Apostles' Creed"></label>
  <label class="f">Text to memorize<textarea id="ownX" rows="6" maxlength="6000" placeholder="I believe in God, the Father almighty, creator of heaven and earth."></textarea></label>
  <p class="small muted" style="margin:0">Long text is split into parts by line or sentence, and parts unlock one at a time. Start each part on a new line to choose the breaks yourself.</p>
  <div class="rowx small"><span class="muted">Try one:</span>${OWN_EXAMPLES.map((e,i)=>`<button class="chip" style="cursor:pointer" data-act="ownEx" data-i="${i}">${esc(e[0])}</button>`).join("")}</div>
  <div class="small" id="ownErr" style="color:var(--warn)"></div>
  <button class="btn primary" data-act="addOwn">Add to my list</button></div>`}
function splitOwn(t){t=t.replace(/\r/g,"").trim();let lines=t.split(/\n+/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
  if(lines.length>1)return lines;
  if(lines.length===1){lines=(t.replace(/\s+/g," ").match(/[^.!?;]+[.!?;]+["'”’)]*|[^.!?;]+$/g)||[t]).map(s=>s.trim()).filter(Boolean)}
  const out=[];let cur="";lines.forEach(l=>{if(cur&&(cur+" "+l).split(" ").length>28){out.push(cur);cur=l}else cur=cur?cur+" "+l:l});if(cur)out.push(cur);
  return out.length>1&&t.split(/\s+/).length<=30?[out.join(" ")]:out}
handlers.ownEx=a=>{const e=OWN_EXAMPLES[+a.dataset.i];$("#ownT").value=e[0];$("#ownX").value=e[1]};
handlers.addOwn=()=>{const t=$("#ownT").value.trim(),x=$("#ownX").value.trim(),err=$("#ownErr");
  if(!t){err.textContent="Add a title so you can recite it first.";return}if(x.split(/\s+/).length<3){err.textContent="Add at least a few words to memorize.";return}
  const parts=splitOwn(x);const v=newVerse({b:t,c:0,v1:0,v2:0,bsb:"",kjv:""},"own");
  Object.assign(v,{id:"own|"+Date.now(),custom:true,title:t,own:parts.join(" "),ownParts:parts});
  S.verses.push(v);save();toast("Added "+t);view={};renderVerses()};
handlers.src=a=>{view.src=a.dataset.v;renderAdd()};
handlers.tr=a=>{view.tr=a.dataset.v;renderAdd()};
handlers.addStarter=a=>{const s=STARTER.find(x=>idOf(x)===a.dataset.id);S.verses.push(newVerse(s,view.tr));save();toast("Added "+refOf(s));renderAdd()};
async function buildPicker(){
  let B;try{B=await loadBible(view.tr)}catch(e){$("#picker").innerHTML=`<div class="small muted">Couldn't load the Bible text. Check your connection and try again.</div>`;return}
  const p=view.pk||(view.pk={b:42,c:1,v1:1,v2:1});const book=B[p.b],ch=book[1][p.c-1]||[];
  const opt=(n,sel)=>Array.from({length:n},(_,i)=>`<option value="${i+1}" ${sel===i+1?"selected":""}>${i+1}</option>`).join("");
  const txt=ch.slice(p.v1-1,p.v2).join(" ");
  $("#picker").innerHTML=`<label class="f">Book<select id="pkB">${B.map((b,i)=>`<option value="${i}" ${i===p.b?"selected":""}>${esc(b[0])}</option>`).join("")}</select></label>
  <div class="grid2"><label class="f">Chapter<select id="pkC">${opt(book[1].length,p.c)}</select></label><div class="grid2"><label class="f">From<select id="pkV1">${opt(ch.length,p.v1)}</select></label><label class="f">To<select id="pkV2">${opt(ch.length,p.v2)}</select></label></div></div>
  <div class="ref">${esc(book[0])} ${p.c}:${p.v1}${p.v2>p.v1?"-"+p.v2:""}</div><div class="verse" style="font-size:17px">${esc(txt)}</div>
  ${p.v2-p.v1>=1?`<p class="small muted" style="margin:0">Passages unlock one verse at a time, always reviewed from the top.</p>`:""}
  <button class="btn primary" data-act="addAny">Add to my verses</button>`;
  const upd=()=>{const nb=+$("#pkB").value;if(nb!==p.b){p.b=nb;p.c=1;p.v1=1;p.v2=1}else{const nc=+$("#pkC").value;if(nc!==p.c){p.c=nc;p.v1=1;p.v2=1}else{p.v1=+$("#pkV1").value;p.v2=Math.max(p.v1,+$("#pkV2").value);if(p.v2-p.v1>11)p.v2=p.v1+11}}buildPicker()};
  ["#pkB","#pkC","#pkV1","#pkV2"].forEach(s=>$(s).addEventListener("change",upd));}

  const s={b:bn,c:p.c,v1:p.v1,v2:p.v2,bsb:bp.join(" "),kjv:kp.join(" "),bsbParts:bp,kjvParts:kp};

  ${STANDALONE&&!isInstalled()?`<div class="card" style="margin-top:12px"><div class="setrow"><div class="grow"><b>Install the app</b><div class="small muted">Put Full Armor on your home screen.</div></div><button class="btn sm" data-act="install">Install</button></div></div>`:""}
  <p class="small muted">Starting verses: switch between Foundations and Young Warriors on the Verses tab.</p>`}
handlers.set=a=>{const k=a.dataset.k,v=a.dataset.v;S.settings[k]=k==="minutes"?+v:v==="true";save();applySettings();renderSettings()};
handlers.onb=a=>{const t=a.dataset.v;if(t==="kid"){S.paths.found.set="kids";S.paths.found.lastDay="";S.settings.easy=true}else if(t==="senior"){S.settings.big=true;S.settings.speak=true}else{S.paths.found.set="found"}
  S.onboarded=true;save();applySettings();feedPaths().then(()=>{renderHeader();renderTrain()});toast(t==="kid"?"Young Warriors path ready":t==="senior"?"Larger text on":"Foundations path ready")};

/* ---------- PRAYER ---------- */
let prayers=[],prayState="loading",unsubP=null,names={};
async function resolveNames(){if(!user)return;const ids=[...new Set(prayers.flatMap(p=>[p.author,...Object.keys(p.prayedBy||{})]).filter(Boolean))];try{const ps=await user.profiles(ids);ids.forEach(id=>{names[id]=(ps[id]&&ps[id].name)||"Someone"})}catch(e){}}
function initials(n){return(n||"?").split(" ").map(s=>s[0]).join("").slice(0,2).toUpperCase()}
function ago(t){const s=(Date.now()-t)/1000;if(s<3600)return Math.max(1,Math.round(s/60))+"m ago";if(s<86400)return Math.round(s/3600)+"h ago";return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function renderPrayer(){const app=$("#app");
  if(prayState==="off"){app.innerHTML=`<h2>Prayer cards</h2><div class="card empty">${ICONS.prayer}${typeof window.claude==="undefined"?`<div><b>Prayer cards are coming soon.</b></div><div class="small">Soon you and your friends will be able to share requests and pray for each other here.</div>`:`<div><b>Sign in to share prayer cards.</b></div><div class="small">Prayer cards are shared with friends who open this app while signed in to Claude.</div>`}</div>`;return}
  const f=view.pf||"all",list=prayers.filter(p=>f==="all"?!p.answered:f==="mine"?p.author===uid:p.answered).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  app.innerHTML=`<div class="rowx"><h2 style="margin-right:auto">Prayer cards</h2><button class="btn primary sm" data-act="newPrayer">New card</button></div>
  <div class="stack">
    ${weeklyHTML()}
    ${view.compose?`<div class="card stack"><label class="f">Title<input type="text" id="pT" maxlength="80" placeholder="Example: Job interview on Friday"></label><label class="f">Request<textarea id="pB" maxlength="1200" placeholder="What should friends pray for?"></textarea></label><div class="rowx"><button class="btn primary" data-act="postPrayer">Share with friends</button><button class="btn ghost" data-act="cancelPrayer">Cancel</button></div></div>`:""}
    <div class="seg" style="align-self:flex-start">${[["all","Active"],["mine","Mine"],["answered","Answered"]].map(([k,l])=>`<button data-act="pf" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
    ${prayState==="loading"?`<div class="card empty">Loading prayer cards…</div>`:prayState==="slow"?`<div class="card empty">Prayer cards can't be reached yet. They'll appear when your connection returns.</div>`:""}
    ${prayState==="ready"&&!list.length?`<div class="card empty">${ICONS.prayer}<div><b>${f==="answered"?"No answered prayers yet.":"No prayer cards here yet."}</b></div><div class="small">${f==="answered"?"Mark a card answered to celebrate it here.":"Tap New card to share a request. Friends you share this app with will see it and can pray for you."}</div></div>`:""}
    ${list.map(prayerCard).join("")}
    <p class="small muted" style="margin:0">To pray together, share this app's link with friends. Anyone you share it with can see these cards, tap I prayed, and post their own.</p>
  </div>`;}
function prayerCard(p){const mine=p.author===uid,pb=p.prayedBy||{},n=Object.keys(pb).length,iPrayed=uid&&pb[uid];const ups=Object.values(p.updates||{}).sort((a,b)=>a.at-b.at);
  return `<div class="card prayer ${p.answered?"answered":""}"><div class="who"><span class="avatar">${initials(names[p.author])}</span><b>${esc(mine?"You":names[p.author]||"Someone")}</b><span class="muted">${ago(p.createdAt||0)}</span>${p.answered?`<span class="chip good" style="margin-left:auto">Answered</span>`:""}</div>
  <h3 style="margin-top:8px">${esc(p.title)}</h3><div class="body">${esc(p.body)}</div>
  ${ups.map(u=>`<div class="upd"><span class="muted small">Update · ${ago(u.at)}</span><br>${esc(u.text)}</div>`).join("")}
  <div class="rowx" style="margin-top:8px"><button class="btn sm ${iPrayed?"":"primary"}" data-act="prayed" data-id="${esc(p.id)}">${iPrayed?"You prayed":"I prayed"}</button><span class="small muted">${n?`${n} prayed${n<=3?": "+Object.keys(pb).map(k=>k===uid?"you":esc(names[k]||"someone")).join(", "):""}`:"Be the first to pray"}</span></div>
  ${mine?(view.upd===p.id?`<div class="stack" style="margin-top:10px"><textarea id="uT" maxlength="600" placeholder="Share an update"></textarea><div class="rowx"><button class="btn sm primary" data-act="postUpd" data-id="${esc(p.id)}">Post update</button><button class="btn sm ghost" data-act="cancelUpd">Cancel</button></div></div>`
    :view.pdel===p.id?`<div class="confirm" style="margin-top:10px">Delete this card for everyone? <button class="btn sm" data-act="pDelYes" data-id="${esc(p.id)}">Delete</button><button class="btn sm ghost" data-act="pDelNo">Cancel</button></div>`
    :`<div class="rowx" style="margin-top:8px"><button class="btn sm ghost" data-act="upd" data-id="${esc(p.id)}">Add update</button><button class="btn sm ghost" data-act="answer" data-id="${esc(p.id)}">${p.answered?"Mark active":"Mark answered"}</button><button class="btn sm ghost" data-act="pDel" data-id="${esc(p.id)}">Delete</button></div>`):""}
  </div>`;}
handlers.pf=a=>{view.pf=a.dataset.v;renderPrayer()};
handlers.newPrayer=()=>{view.compose=1;renderPrayer();setTimeout(()=>$("#pT")&&$("#pT").focus(),30)};
handlers.cancelPrayer=()=>{view.compose=0;renderPrayer()};
handlers.postPrayer=async a=>{const t=$("#pT").value.trim(),b=$("#pB").value.trim();if(!t){toast("Add a title first");return}a.disabled=true;
  try{const now=Date.now();await db.collection("prayers").add({author:uid,title:t,body:b,createdAt:now,updatedAt:now,answered:false,prayedBy:{},updates:{}});view.compose=0;award(5,"Prayer card shared")}catch(e){a.disabled=false;toast(e&&e.code==="permission_denied"?"You need edit access to post. Ask the owner to share it with you.":"Couldn't post. Try again.")}};
handlers.prayed=async a=>{const p=prayers.find(x=>x.id===a.dataset.id);if(!p||!uid||(p.prayedBy||{})[uid])return;
  try{await db.doc("prayers/"+p.id).update({prayedBy:{[uid]:Date.now()}});S.prayedCount=(S.prayedCount||0)+1;award(5,"Prayed for a friend")}catch(e){toast("Couldn't save. Try again.")}};
handlers.upd=a=>{view.upd=a.dataset.id;renderPrayer()};handlers.cancelUpd=()=>{view.upd=null;renderPrayer()};
handlers.postUpd=async a=>{const t=$("#uT").value.trim();if(!t)return;const k="u"+Date.now();try{await db.doc("prayers/"+a.dataset.id).update({updates:{[k]:{text:t,at:Date.now()}},updatedAt:Date.now()});view.upd=null;renderPrayer()}catch(e){toast("Couldn't post the update.")}};
handlers.answer=async a=>{const p=prayers.find(x=>x.id===a.dataset.id);try{await db.doc("prayers/"+p.id).update({answered:!p.answered,updatedAt:Date.now()});if(!p.answered)toast("Praise God. Marked answered.")}catch(e){toast("Couldn't save.")}};
handlers.pDel=a=>{view.pdel=a.dataset.id;renderPrayer()};handlers.pDelNo=()=>{view.pdel=null;renderPrayer()};
handlers.pDelYes=async a=>{try{await db.doc("prayers/"+a.dataset.id).delete();view.pdel=null}catch(e){toast("Couldn't delete.")}};

/* ---------- BOOT ---------- */
applySettings();renderTabs();renderHeader();render();
feedPaths().then(c=>{if(c&&!session){renderHeader();render()}});
(async()=>{
  try{dict=await claude.use("dictation")}catch(e){dict=null}
  try{user=await claude.use("user");db=await claude.use("db")}catch(e){}
  if(!db||!user){prayState="off";if(tab==="prayer")renderPrayer();if(tab==="train"||tab==="verses")render();return}
  try{const me=await user.me();uid=me&&me.id||await user.id()}catch(e){}
  if(!uid){prayState="off";render();return}
  try{canLead=await user.canEdit()}catch(e){canLead=false}
  try{db.doc("group/weekly").onSnapshot(s=>{weekly=s.exists?s.data():null;if((tab==="train"&&!session)||tab==="prayer")render()},()=>{})}catch(e){}
  try{const snap=await db.collection("data/users/"+uid).doc("progress").get();
    if(snap.exists){const d=snap.data();if(d&&d.updatedAt>(S.updatedAt||0)){S=JSON.parse(d.json);migrate();await feedPaths();try{localStorage.setItem("fullarmor.v1",JSON.stringify(S))}catch(e){}renderHeader()}}
    else save();}catch(e){}
  const slow=setTimeout(()=>{if(prayState==="loading"){prayState="slow";if(tab==="prayer")renderPrayer()}},10000);
  unsubP=db.collection("prayers").orderBy("updatedAt","desc").limit(200).onSnapshot(async snap=>{
    prayers=snap.docs.map(d=>({id:d.id,...d.data()}));if(!snap.metadata||!snap.metadata.fromCache){clearTimeout(slow)}prayState="ready";await resolveNames();if(tab==="prayer")renderPrayer()},
    ()=>{clearTimeout(slow);prayState="slow";if(tab==="prayer")renderPrayer()});
  if(!session)render();
})();
</script>

</body>
</html>
